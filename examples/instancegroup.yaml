apiVersion: aws.provisioner.app/v1alpha1
kind: InstanceGroup
metadata:
  name: test
  namespace: provisioner
spec:
  name: "test-asg-operator031"
  region: "ap-south-1"
  amiId: "ami-085ff1153b5d0a859"
  vpcZoneIdentifier: "subnet-0ed85e5a4be2f9f17" #"vpc-0325ab6456912a5d6"
  minSize: 1
  maxSize: 1
  desiredCapacity: 1
  instanceType: "r5.large"
  volumeSize: 30
  keyName: "prod_mumbai_services"
  securityGroupId: "sg-00cd3152462242bc0"
  userData: |-
    #!/bin/bash

    exec >> /var/log/bootscript.log 2>&1
    echo "Start Time: $(date)"

    set -o nounset # exit on unbound vars
    set -o xtrace # show more

    ulimit -n 1048576
    sysctl -w fs.file-max=6815744
    sysctl -w vm.swappiness=1
    sysctl -w net.core.somaxconn=65536

    # https://github.com/kubernetes-sigs/aws-ebs-csi-driver/blob/master/docs/faq.md
    echo -e "InhibitDelayMaxSec=45\n"    
  iamInstanceProfile: "arn:aws:iam::028686181435:instance-profile/terraform-eks-devops-eks012023062611254195470000000d"
  mixedInstancesPolicy: true
  mixedInstanceTypes: ["r5.large", "t3a.large"]
  preventDeletion: true
  tags:
    - key: "Environment"
      value: "Production"
      propagateAtLaunch: true
    - key: "Project"
      value: "NodeManager"
      propagateAtLaunch: true
    - key: "ManagedBy"
      value: "kubernetes-operator"
      propagateAtLaunch: true
